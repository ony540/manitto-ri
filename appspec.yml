version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/manitto-ri/ #ec2내부에 필드 폴더를 넣고 싶은 곳
    overwrite: yes
file_exists_behavior: OVERWRITE
permissions:
  - object: /home/ubuntu/manitto-ri/ #위랑 똑같이
    owner: root
    group: root
    mode: 755
hooks:
  ApplicationStop:
    - location: cleanup-disk.sh # 앱 중지 전 디스크 공간 정리
      timeout: 300
      runas: root
  BeforeInstall:
    - location: cleanup-disk.sh # 디스크 공간 정리
      timeout: 300
      runas: root
  AfterInstall:
    - location: deploy.sh #ec2 다 올리고 실행할 bash script
      timeout: 500
      runas: root
